<script src="data.js"></script>
<script src="app.js"></script>
<script>

const params = new URLSearchParams(location.search);
const orderId = params.get('id');
const STEPS = ['Pending', 'Shipped', 'Delivered'];

function renderTimeline(status) {
  const cancelled = status === 'Cancelled';
  const currentIdx = STEPS.indexOf(status);
  let html = STEPS.map((step, idx) => {
    let cls = '';
    if (cancelled) cls = idx === 0 ? 'done' : '';
    else if (idx < currentIdx) cls = 'done';
    else if (idx === currentIdx) cls = 'done current';
    return `<div class="status-step ${cls}"><div class="dot"></div><div class="status-step-label">${step}</div></div>`;
  }).join('');
  if (cancelled) html += `<div class="status-step cancelled"><div class="dot"></div><div class="status-step-label">Cancelled</div></div>`;
  $('#statusTimeline').innerHTML = html;
}

async function load() {
  const o = await getOrder(orderId);
  if (!o) { $('.detail-grid').innerHTML = emptyState('Order not found'); return; }
  $('#pageTitle').textContent = o.id;
  $('#pageSub').textContent = `Order for ${o.supplier}`;

  $('#orderFields').innerHTML = `
    <div class="detail-field"><span>Supplier</span><span>${o.supplier}</span></div>
    <div class="detail-field"><span>Items</span><span>${o.items}</span></div>
    <div class="detail-field"><span>Placed</span><span class="mono">${o.date}</span></div>
    <div class="detail-field"><span>Status</span><span>${orderStatusBadge(o.status)}</span></div>`;

  renderTimeline(o.status);

  const actions = $('#statusActions');
  if (o.status === 'Cancelled' || o.status === 'Delivered') {
    actions.innerHTML = `<p class="view-hint">This order is ${o.status.toLowerCase()} and can't be changed further.</p>`;
  } else {
    const nextIndex = STEPS.indexOf(o.status) + 1;
    const next = STEPS[nextIndex];
    actions.innerHTML = `
      ${next ? `<button class="btn btn-primary" id="advanceBtn">Mark as ${next}</button>` : ''}
      <button class="btn btn-danger" id="cancelBtn">Cancel order</button>`;
    $('#advanceBtn')?.addEventListener('click', async () => {
      try { await updateOrderStatus(orderId, next); await load(); showToast(`Order marked ${next}`); }
      catch (err) { showError(err); }
    });
    $('#cancelBtn')?.addEventListener('click', async () => {
      if (!confirm('Cancel this order?')) return;
      try { await updateOrderStatus(orderId, 'Cancelled'); await load(); showToast('Order cancelled'); }
      catch (err) { showError(err); }
    });
  }
}

load();

</script>
