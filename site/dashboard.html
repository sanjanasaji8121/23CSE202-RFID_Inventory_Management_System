  <main class="main">
    <header class="topbar">
      <div><h1 class="page-title" id="pageTitle">Dashboard</h1><p class="page-sub" id="pageSub">What's happening across your store right now</p></div>
      <div class="topbar-actions">
        <div class="notif-wrap">
          <button class="notif-btn" id="notifBtn" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-count" id="notifCount">0</span>

        </div>
      </div>
    </header>

    <div class="stat-grid" id="statGrid"></div>
    <div class="dashboard-grid">
      <div class="panel">
        <div class="panel-title-row"><h2>Recent scans</h2><a class="link-btn" href="scan-log.html">View all</a></div>
        <div class="mini-scan-list" id="recentScans"></div>
      </div>
      <div class="panel">
        <div class="panel-title-row"><h2>Needs reordering</h2><a class="link-btn" href="inventory.html">View all</a></div>
        <div class="low-stock-list" id="lowStockList"></div>
      </div>
    </div>
  </main>
</div>



<script src="data.js"></script>
<script src="app.js"></script>
<script>

async function renderDashboard() {
  const summary = await getDashboardSummary();
  const scans = (await getScans()).slice(0, 5);
  const products = await getProducts();
  const lowStock = products.filter(p => p.qty <= p.reorder).sort((a,b) => a.qty - b.qty).slice(0, 5);

  $('#statGrid').innerHTML =
    `<div class="stat-card"><div class="stat-value">${summary.totalProducts}</div><div class="stat-label">Tracked products</div></div>` +
    `<div class="stat-card ${summary.lowStock ? 'alert' : ''}"><div class="stat-value">${summary.lowStock}</div><div class="stat-label">Needs reordering</div></div>` +
    `<div class="stat-card"><div class="stat-value">${summary.scansToday}</div><div class="stat-label">Scans, last 24h</div></div>` +
    `<div class="stat-card"><div class="stat-value">${money(summary.totalValue)}</div><div class="stat-label">Inventory value</div></div>`;

  $('#recentScans').innerHTML = scans.map(s => `
    <div class="mini-scan-row">
      <div><div>${s.productName}</div><div class="mini-scan-tag">${s.tagId} · ${timeAgo(s.time)}</div></div>
      <span class="badge ${s.action === 'IN' ? 'success' : 'warning'}">${s.action === 'IN' ? 'In' : 'Out'} · ${s.qty}</span>
    </div>`).join('') || emptyState('No scans yet');

  // maxStock actually does something here: the suggested reorder quantity
  // (how much to bring this item back up to its max) instead of just showing
  // the current low count with nothing to act on.
  $('#lowStockList').innerHTML = lowStock.map(p => `
    <div class="low-stock-row"><span>${p.name}</span><span class="low-stock-qty">${p.qty} left \u00b7 order ${Math.max(0, p.maxStock - p.qty)}</span></div>
  `).join('') || emptyState('Everything is well stocked');
}

renderDashboard();
// Keep this page live: if a scan happens elsewhere (another tab, the
// Arduino, another user), reflect it here without needing a manual refresh.
setInterval(renderDashboard, 5000);

</script>
</body>
</html>
