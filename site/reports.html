    <div class="chart-card" style="max-width: 560px;">

<script src="data.js"></script>
<script src="app.js"></script>
<script>

async function renderCategoryChart() {
  const data = await getStockByCategory();
  const max = Math.max(...data.map(d => d.qty), 1);
  $('#categoryChart').innerHTML = data.map(d => `
    <div class="bar-col">
      <div class="bar-value">${d.qty}</div>
      <div class="bar" style="height:${(d.qty / max * 100).toFixed(0)}%"></div>
      <div class="bar-label">${d.category}</div>
    </div>`).join('');
}

$('#exportBtn').addEventListener('click', async () => {
  const products = await getProducts();
  exportCSV('stock-report.csv', products.map(p => ({ product: p.name, tag: p.tagId, category: p.category, qty: p.qty, reorder: p.reorder, unitPrice: p.unitPrice })));
});

renderCategoryChart();

</script>
