      <div><h1 class="page-title" id="pageTitle">Suppliers</h1><p class="page-sub" id="pageSub">Who you order from, and how fast they ship</p></div>

<div class="modal-overlay" id="supplierModalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="supplierModalTitle">
    <h3 id="supplierModalTitle">Add supplier</h3>
    <form id="supplierForm">
      <label>Supplier name<input type="text" name="name" required /></label>
      <label>Contact email<input type="email" name="contact" required /></label>
      <label>Category<input type="text" name="category" required /></label>
      <label>Lead time<input type="text" name="leadTime" placeholder="e.g. 3–5 days" required /></label>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="supplierModalCancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save supplier</button>
      </div>
    </form>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>

let editingSupplier = null;

async function renderSuppliers() {
  const suppliers = await getSuppliers();
  $('#supplierGrid').innerHTML = suppliers.map(s => `
    <div class="supplier-card">
      <div class="supplier-name"><a href="supplier-detail.html?name=${encodeURIComponent(s.name)}&role=${getRole()}">${s.name}</a></div>
      <div class="supplier-meta">${s.contact} · ${s.category}</div>
      <div class="supplier-stat"><span>Lead time</span><span>${s.leadTime}</span></div>
      <div class="supplier-card-actions"><button class="btn btn-ghost btn-sm" data-edit="${s.name}">Edit</button></div>
    </div>`).join('');
  $$('[data-edit]').forEach(b => b.addEventListener('click', () => openEdit(b.dataset.edit)));
}

async function openEdit(name) {
  const s = await getSupplier(name);
  editingSupplier = name;
  $('#supplierModalTitle').textContent = 'Edit supplier';
  const form = $('#supplierForm');
  form.name.value = s.name; form.contact.value = s.contact; form.category.value = s.category; form.leadTime.value = s.leadTime;
  openModal('supplierModalOverlay');
}

wireModal('supplierModalOverlay', 'addSupplierBtn', 'supplierModalCancel');
$('#addSupplierBtn').addEventListener('click', () => { editingSupplier = null; $('#supplierModalTitle').textContent = 'Add supplier'; $('#supplierForm').reset(); });

$('#supplierForm').addEventListener('submit', async e => {
  e.preventDefault();
  const data = new FormData(e.target);
  const values = { name: data.get('name'), contact: data.get('contact'), category: data.get('category'), leadTime: data.get('leadTime') };
  try {
    if (editingSupplier) { await updateSupplier(editingSupplier, values); showToast('Supplier updated'); }
    else { await addSupplier(values); showToast('Supplier added'); }
    closeModal('supplierModalOverlay');
    await renderSuppliers();
  } catch (err) { showError(err); }
});

renderSuppliers();

</script>
</body>
