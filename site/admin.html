<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — StockTrace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle navigation">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><span class="brand-mark" aria-hidden="true">&#9670;</span><span class="brand-name">STOCKTRACE</span></div>
    <nav class="sidebar-nav" aria-label="Primary">
      <a class="nav-item" href="dashboard.html" data-roles="admin,manager,staff">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="nav-item" href="inventory.html" data-roles="admin,manager,staff">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
        <span>Inventory</span>
      </a>
      <a class="nav-item" href="scan-log.html" data-roles="admin,manager,staff">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><path d="M8.5 15.5a5 5 0 0 1 0-7"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M5.5 18.5a9 9 0 0 1 0-13"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <span>Scan Log</span>
      </a>
      <a class="nav-item" href="orders.html" data-roles="admin,manager">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="1.5"/><path d="M9 3.5h6a1 1 0 0 1 1 1V6H8V4.5a1 1 0 0 1 1-1Z"/><path d="M8.5 11h7"/><path d="M8.5 14.5h7"/><path d="M8.5 18h4"/></svg>
        <span>Orders</span>
      </a>
      <a class="nav-item" href="suppliers.html" data-roles="admin,manager">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16V6a1 1 0 0 1 1-1h9v11"/><path d="M13 9h4l4 4v3h-8"/><circle cx="7.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>
        <span>Suppliers</span>
      </a>
      <a class="nav-item" href="reports.html" data-roles="admin,manager">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>
        <span>Reports</span>
      </a>
      <a class="nav-item" href="admin.html" data-roles="admin">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>Admin</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="role-pill" id="rolePill">
        <span>Viewing as <span class="role-pill-name">Manager</span></span>
        <a href="login.html">Switch</a>
      </div>
    </div>
  </aside>
  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <main class="main">
    <header class="topbar">
      <div><h1 class="page-title" id="pageTitle">Admin</h1><p class="page-sub" id="pageSub">Users, system settings, and activity history</p></div>
      <div class="topbar-actions">
        
        <div class="notif-wrap">
          <button class="notif-btn" id="notifBtn" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-count" id="notifCount">0</span>
          </button>
          <div class="notif-dropdown" id="notifDropdown"></div>
        </div>
      </div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="users">Users</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
      <button class="tab-btn" data-tab="audit">Audit log</button>
    </div>

    <div class="tab-panel active" id="tab-users">
      <div class="toolbar"><div></div><button class="btn btn-primary" id="addUserBtn">+ Add user</button></div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </div>

    <div class="tab-panel" id="tab-settings">
      <div class="detail-card" style="max-width:480px">
        <h2>Reorder &amp; notifications</h2>
        <form id="settingsForm" class="adjust-form" style="margin-top:14px">
          <label>Default reorder point (% of max stock)<input type="number" name="defaultReorderPercent" min="0" max="100" /></label>
          <label style="flex-direction:row;align-items:center;gap:8px;"><input type="checkbox" name="lowStockNotifications" style="width:auto" /> Low-stock notifications</label>
          <label style="flex-direction:row;align-items:center;gap:8px;"><input type="checkbox" name="orderStatusNotifications" style="width:auto" /> Order status notifications</label>
          <div><button type="submit" class="btn btn-primary btn-sm">Save settings</button></div>
        </form>
      </div>
    </div>

    <div class="tab-panel" id="tab-audit">
      <div class="detail-card">
        <div class="audit-list" id="auditList"></div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="userModalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="userModalTitle">
    <h3 id="userModalTitle">Add user</h3>
    <form id="userForm">
      <label>Full name<input type="text" name="name" required /></label>
      <label>Email<input type="email" name="email" required /></label>
      <label>Role
        <select name="role" required>
          <option value="staff">Staff</option><option value="manager">Manager</option><option value="admin">Admin</option>
        </select>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="userModalCancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Add user</button>
      </div>
    </form>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>

setupTabs();

async function renderUsers() {
  const users = await getUsers();
  $('#usersBody').innerHTML = users.map(u => `<tr><td class="row-title">${u.name}</td><td>${u.email}</td><td>${roleBadge(u.role)}</td></tr>`).join('');
}

wireModal('userModalOverlay', 'addUserBtn', 'userModalCancel');
$('#userForm').addEventListener('submit', async e => {
  e.preventDefault();
  const data = new FormData(e.target);
  const user = { name: data.get('name'), email: data.get('email'), role: data.get('role') };
  try {
    await addUser(user);
    e.target.reset();
    closeModal('userModalOverlay');
    await renderUsers();
    showToast(`Added ${user.name}`);
  } catch (err) { showError(err); }
});

async function loadSettings() {
  const s = await getSettings();
  const form = $('#settingsForm');
  form.defaultReorderPercent.value = s.defaultReorderPercent;
  form.lowStockNotifications.checked = s.lowStockNotifications;
  form.orderStatusNotifications.checked = s.orderStatusNotifications;
}
$('#settingsForm').addEventListener('submit', async e => {
  e.preventDefault();
  const data = new FormData(e.target);
  try {
    await updateSettings({
      defaultReorderPercent: Number(data.get('defaultReorderPercent')),
      lowStockNotifications: data.get('lowStockNotifications') === 'on',
      orderStatusNotifications: data.get('orderStatusNotifications') === 'on',
    });
    showToast('Settings saved');
  } catch (err) { showError(err); }
});

async function renderAudit() {
  const log = await getAuditLog();
  $('#auditList').innerHTML = log.map(a => `<div class="audit-row"><div class="audit-time">${timeAgo(a.time)}</div><div><span class="audit-actor">${a.actor}</span> ${a.action}</div></div>`).join('') || emptyState('No activity yet');
}

renderUsers();
loadSettings();
renderAudit();

</script>
</body>
</html>
