      <div class="topbar-actions">
        <button class="btn btn-ghost" id="editBtn">Edit</button>
        <div class="notif-wrap">
          <button class="notif-btn" id="notifBtn" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>

        </div>
      </div>
    </header>

    <a class="back-link" href="suppliers.html">&larr; Back to suppliers</a>
    <div class="detail-grid">
      <div class="detail-card">
        <h2>Supplier details</h2>
        <div id="supplierFields"></div>
      </div>
      <div class="detail-card">
        <h2>Order history</h2>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Order</th><th>Items</th><th>Status</th><th>Placed</th></tr></thead>
            <tbody id="orderHistoryBody"></tbody>
          </table>
        </div>
      </div>
    </div>

</div>

<div class="modal-overlay" id="editModalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
    <h3 id="editModalTitle">Edit supplier</h3>
    <form id="editForm">
      <label>Contact email<input type="email" name="contact" required /></label>
      <label>Category<input type="text" name="category" required /></label>
      <label>Lead time<input type="text" name="leadTime" required /></label>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="editModalCancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>

const params = new URLSearchParams(location.search);
const supplierName = params.get('name');

async function load() {
  const s = await getSupplier(supplierName);
  if (!s) { $('.detail-grid').innerHTML = emptyState('Supplier not found'); return; }
  $('#pageTitle').textContent = s.name;
  $('#pageSub').textContent = s.category;
  $('#supplierFields').innerHTML = `
    <div class="detail-field"><span>Contact</span><span>${s.contact}</span></div>
    <div class="detail-field"><span>Category</span><span>${s.category}</span></div>
    <div class="detail-field"><span>Lead time</span><span>${s.leadTime}</span></div>`;
  const orders = await getOrdersForSupplier(supplierName);
  $('#orderHistoryBody').innerHTML = orders.map(o => `
    <tr><td class="mono"><a href="order-detail.html?id=${o.id}&role=${getRole()}">${o.id}</a></td><td>${o.items}</td><td>${orderStatusBadge(o.status)}</td><td class="mono">${o.date}</td></tr>
  `).join('') || `<tr><td colspan="4">${emptyState('No orders yet with this supplier')}</td></tr>`;
}

$('#editBtn').addEventListener('click', async () => {
  const s = await getSupplier(supplierName);
  const form = $('#editForm');
  form.contact.value = s.contact; form.category.value = s.category; form.leadTime.value = s.leadTime;
  openModal('editModalOverlay');
});
wireModal('editModalOverlay', null, 'editModalCancel');
$('#editForm').addEventListener('submit', async e => {
  e.preventDefault();
  const data = new FormData(e.target);
  try {
    await updateSupplier(supplierName, { contact: data.get('contact'), category: data.get('category'), leadTime: data.get('leadTime') });
    closeModal('editModalOverlay');
    await load();
    showToast('Supplier updated');
  } catch (err) { showError(err); }
});

load();

</script>
</body>
</html>
